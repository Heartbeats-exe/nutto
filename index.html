<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jasmine&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jasmine', sans-serif;
            background-color: #FFF5E4; /* Soft pastel background */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #FF9494; /* Cute soft pink text */
        }
        h1 {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 2px 2px #FFD1D1;
        }
        button {
            font-size: 1.2rem;
            padding: 15px 30px;
            background: linear-gradient(45deg, #FF94D1, #FFD1F0);
            color: #FFF;
            border: none;
            border-radius: 30px;
            box-shadow: 0px 4px 10px rgba(255, 148, 209, 0.5);
            position: relative;
            transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s;
            overflow: hidden;
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0px 6px 15px rgba(255, 148, 209, 0.7);
            background: linear-gradient(45deg, #FF80C0, #FFB3E0);
        }
        button:active {
            transform: scale(1.05);
            box-shadow: 0px 3px 6px rgba(255, 148, 209, 0.4);
        }
        button::before {
            content: "❤️";
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 2rem;
            opacity: 0;
            color: #FFD1F0;
            transition: all 0.4s ease;
        }
        button:hover::before {
            top: -10px;
            right: -10px;
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="text-center">
        <h1>กดตรงนี้ !!</h1>
        <button type="button" class="btn" onclick="xx()">Press here!!</button>
    </div>
    <script>
        function xx() {
            Swal.fire({
                title: "เราได้ขโมยข้อมูลคุณหมดแล้ว",
                text: "เราค่าไถ่มาาาา อิอิอิอิอิ ❤️",
                icon: "info",
                confirmButtonColor: "#FF94D1"
            });
        }
    </script>
</body>
</html>
